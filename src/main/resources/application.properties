# Application Configuration
spring.application.name=hospital-management-system
server.port=8080

# Load environment variables from root .env file
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Configuration
spring.datasource.url=${HMS_DB_URL}
spring.datasource.username=${HMS_DB_USERNAME}
spring.datasource.password=${HMS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.com.example.hms=INFO
logging.level.org.springframework.security=INFO