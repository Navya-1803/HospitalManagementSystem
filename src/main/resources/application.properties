# Application Configuration
spring.application.name=hospital-management-system

server.port=8080

# Environment Variable Configuration
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=${HMS_DB_URL}
spring.datasource.username=${HMS_DB_USERNAME}
spring.datasource.password=${HMS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View
spring.jpa.open-in-view=false

# logging
logging.level.com.example.hms=INFO
logging.level.org.springframework=INFO